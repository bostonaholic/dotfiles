# Publishes bootstrap.sh to GitHub Pages at init.bostonaholic.dev, so a fresh
# machine can run: curl init.bostonaholic.dev | bash
#
# The script is served as index.html because Pages only serves a directory
# root from index.html. Leave "Enforce HTTPS" off in the Pages settings: bare
# `curl init.bostonaholic.dev` requests http:// and does not follow redirects.
name: Publish bootstrap

on:
  push:
    branches: [main]
    paths: [bootstrap.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir _site
          cp bootstrap.sh _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
