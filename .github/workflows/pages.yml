# Publishes dotfiles.bostonaholic.dev to GitHub Pages: site/build joins the landing
# page (site/index.html) and bootstrap.sh into one index.html that browsers
# render as a page and `curl dotfiles.bostonaholic.dev | bash` runs as a script.
#
# Leave "Enforce HTTPS" off in the Pages settings: bare
# `curl dotfiles.bostonaholic.dev` requests http:// and does not follow redirects.
name: Publish bootstrap

on:
  push:
    branches: [main]
    paths: [bootstrap.sh, site/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: site/build _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
