# Dotfiles Configuration
# This file defines all symlinks, directories, and packages to be installed

directories:
  - ~/.agents
  - ~/.agents/skills
  - ~/.claude
  - ~/.claude/skills
  - ~/.cursor
  - ~/.gemini/antigravity-cli
  - ~/.lein
  - ~/.gnupg
  - ~/.pi/agent
  - ~/.rbenv
  - ~/Library/Application Support/Code/User

symlinks:
  # Scripts
  bin: ~/bin

  # Claude
  claude/keybindings.json: ~/.claude/keybindings.json
  claude/settings.json: ~/.claude/settings.json
  claude/statusline.sh: ~/.claude/statusline.sh

  # Obsidian
  obsidian/skills/define: ~/Documents/obsidian-vault/.claude/skills/define
  obsidian/skills/summarize-note: ~/Documents/obsidian-vault/.claude/skills/summarize-note

  # Antigravity CLI (config lives under ~/.gemini/, replaces Gemini CLI)
  antigravity/settings.json: ~/.gemini/antigravity-cli/settings.json

  # Pi (coding agent)
  pi/agent/settings.json: ~/.pi/agent/settings.json

  # OpenCode (coding agent)
  opencode/opencode.jsonc: ~/.config/opencode/opencode.jsonc

  # Global agent instructions (shared across coding agents)
  agents/AGENTS.md: ~/.agents/AGENTS.md
  agents/AGENTS.md: ~/.claude/CLAUDE.md         # Claude Code
  agents/AGENTS.md: ~/.codex/AGENTS.md          # Codex CLI
  agents/AGENTS.md: ~/.gemini/AGENTS.md         # Antigravity (cross-tool global rules)
  agents/AGENTS.md: ~/.config/opencode/AGENTS.md # OpenCode
  agents/AGENTS.md: ~/.pi/agent/AGENTS.md       # Pi

  # Shell
  zsh/zshenv: ~/.zshenv
  zsh/zshrc: ~/.zshrc
  zsh/zprofile: ~/.zprofile

  # Git
  git: ~/.config/git

  # GitHub CLI
  gh: ~/.config/gh

  # Cursor
  cursor/rules: ~/.cursor/rules

  # Ruby
  ruby/.ruby-version: ~/.ruby-version
  ruby/pryrc: ~/.pryrc
  ruby/rspec: ~/.rspec
  ruby/default-gems: ~/.rbenv/default-gems

  # Node
  node/node-version: ~/.node-version

  # Editors
  emacs/spacemacs: ~/.spacemacs
  nvim: ~/.config/nvim
  vim/my_configs.vim: ~/.vim_runtime/my_configs.vim
  vscode/keybindings.json: ~/Library/Application Support/Code/User/keybindings.json
  vscode/settings.json: ~/Library/Application Support/Code/User/settings.json

  # Other tools
  home/colors: ~/.colors
  gpg/gpg-agent.conf: ~/.gnupg/gpg-agent.conf
  ignore/ignore: ~/.ignore
  ignore/rgignore: ~/.rgignore
  markdownlint/.markdownlintrc: ~/.markdownlintrc
  javascript/jsbeautifyrc: ~/.jsbeautifyrc
  javascript/jshintrc: ~/.jshintrc
  clojure/profiles.clj: ~/.lein/profiles.clj
  keyboard/qwerty.txt: ~/qwerty.txt
  signature/signature: ~/.signature

# Symlink all files from source directory into target directory
# (target directory must already exist, individual files are symlinked)
symlink_contents:
  emacs/templates: ~/.emacs.d/private/templates

packages:
  brew:
    bundle_file: Brewfile

  npm:
    global_packages:
      - prettier
      - prettier-eslint
      - prettier-eslint-cli
      - tern
      - ulid

  pipx:
    packages:
      - jcodemunch-mcp

  uv:
    tool_packages:
      - name: specify-cli
        source: "git+https://github.com/github/spec-kit.git"

  # Agent plugins, installed with each harness's native plugin commands from
  # GitHub marketplaces, never from a local checkout.
  # marketplaces: GitHub owner/repo; plugins: plugin-name@marketplace-name
  #
  # Claude Code: 'claude plugin marketplace add' + 'claude plugin install'
  # Run: ./scripts/install_claude_plugins to install
  # Run: ./scripts/update_claude_plugins to update (installs any missing first)
  claude:
    marketplaces:
      - anthropics/claude-plugins-official
      - cloudflare/skills
      - bostonaholic/team
      - bostonaholic/skills
      - bostonaholic/dev
      - bostonaholic/claude-mods
    plugins:
      - cloudflare@cloudflare
      - typescript-lsp@claude-plugins-official
      - vercel@claude-plugins-official
      - playwright@claude-plugins-official
      - team@team-dev
      - bostonaholic@skills
      - dev@dev
      - bostonaholic@claude-mods

  # Codex CLI: 'codex plugin marketplace add' + 'codex plugin add'
  # Plugins from Codex's built-in openai-curated-remote catalog need no
  # marketplace entry.
  # Run: ./scripts/install_codex_plugins to install
  # Run: ./scripts/update_codex_plugins to update (installs any missing first)
  codex:
    marketplaces:
      - cloudflare/skills
      - loops-so/skills
      - bostonaholic/team
      - bostonaholic/skills
      - bostonaholic/dev
    plugins:
      - cloudflare@cloudflare
      - loops@loops-plugins
      - team@team-dev
      - bostonaholic@skills
      - dev@dev
      - vercel@openai-curated-remote

# macOS privacy (TCC). Apps that must have Full Disk Access. Child processes
# (find, mdfind, claude, agy, ...) inherit the TCC identity of the app that
# launched them, so granting FDA to the host app stops the "would like to
# access data from other apps" prompts. FDA cannot be granted from a script;
# scripts/install_macos_permissions checks status and walks you through it.
macos:
  full_disk_access:
    - /Applications/Conductor.app
    - /Applications/Claude.app
    - /Applications/Cursor.app
    - /Applications/Visual Studio Code.app
    - /System/Applications/Utilities/Terminal.app

scripts:
  pre_install:
    - description: "Validate sudo credentials"
      command: "sudo --validate"

  post_install:
    - description: "Install Spacemacs"
      command: "scripts/install_spacemacs"
      condition: "! [ -d ~/.emacs.d ]"

    - description: "Install vimrc"
      command: "scripts/install_vimrc"
      condition: "! [ -d ~/.vim_runtime ]"

    - description: "Install Catppuccin vim theme"
      command: "scripts/install_catppuccin_vim"
      condition: "[ -d ~/.vim_runtime ] && ! [ -d ~/.vim_runtime/my_plugins/catppuccin ]"

    - description: "Install rbenv plugins"
      command: "scripts/install_rbenv_plugins"
      condition: "[ -d ~/.rbenv ]"

    - description: "Install nodenv"
      command: "scripts/install_nodenv"
      condition: "! command -v nodenv"

    - description: "Install agent skills"
      command: "Skillfile"
      condition: "command -v npx"

    - description: "Install Codex plugins"
      command: "scripts/install_codex_plugins"
      condition: "command -v codex"

    - description: "Install pre-commit hooks"
      command: "pre-commit install"
      condition: "command -v pre-commit"

    - description: "Apply macOS settings"
      command: "macos/macos"
      condition: '[[ "$OSTYPE" == "darwin"* ]]'
      optional: true

    - description: "Check Full Disk Access grants (macOS privacy prompts)"
      command: "scripts/install_macos_permissions"
      condition: '[[ "$OSTYPE" == "darwin"* ]]'
      optional: true

options:
  backup_dir: ~/.dotfiles_backup
  default_shell: zsh
  verbose: false
